<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pills</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #f4f6f9; --line: #e2e8f0; --text: #1e293b; --sub: #64748b; --accent: #6366f1;
    --green: #16a34a; --green-bg: #f0fdf4; --amber: #d97706; --amber-bg: #fffbeb; --red: #dc2626; --red-bg: #fef2f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.1rem; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { height: 30px; width: auto; display: block; }
  #health { font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--line); color: var(--sub); }
  #health.ready { background: #dcfce7; color: var(--green); }
  nav { display: flex; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  nav button { flex: 1; padding: 12px 4px; border: 0; background: none; font-weight: 600; font-size: .9rem; font-family: inherit; color: var(--sub); border-bottom: 3px solid transparent; cursor: pointer; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #qCount { background: var(--red); color: #fff; border-radius: 99px; padding: 0 7px; font-size: .72rem; margin-left: 4px; }
  main { max-width: 620px; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .title { font-size: .85rem; font-weight: 600; color: var(--sub); margin-bottom: 8px; }
  select { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--line); background: #f8fafc; font-weight: 600; font-size: .95rem; font-family: inherit; }
  .rx { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #f8fafc; cursor: pointer; }
  .rx.on { border-color: var(--accent); background: #eef2ff; }
  .rx.done { border-color: #bbf7d0; background: var(--green-bg); color: var(--green); }
  .rx b { font-size: .95rem; }
  .rx small { display: block; font-size: .78rem; color: var(--sub); }
  .rx span { font-size: .78rem; font-weight: 600; color: var(--sub); white-space: nowrap; margin-left: 8px; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .head .title { margin: 0; }
  .link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: .82rem; font-family: inherit; cursor: pointer; }
  .edit { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
  .edit input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: .9rem; font-family: inherit; }
  .edit .line { display: flex; gap: 6px; align-items: center; }
  .edit .line input { flex: 1; }
  .edit .line .drug { flex: 2; font-size: .82rem; }
  .edit .line .drug small { display: block; color: var(--sub); font-size: .74rem; }
  .x-btn { border: 1px solid #fecaca; background: #fff; color: var(--red); border-radius: 8px; padding: 7px 9px; font-size: .78rem; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .ok-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 9px; font-size: .78rem; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .hits { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
  .hits div { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: .84rem; }
  .hits div:hover { background: #eef2ff; }
  .hits small { display: block; color: var(--sub); font-size: .74rem; }
  .demo { padding: 10px; border-radius: 12px; border: 1px solid #c084fc; background: #faf5ff; }
  .demo .title { color: #7e22ce; margin-bottom: 6px; }
  .demo button { padding: 8px; border-radius: 8px; border: 1px solid #d8b4fe; background: #fff; color: #6b21a8; font-weight: 600; font-size: .8rem; font-family: inherit; cursor: pointer; }
  #viewer { position: relative; min-height: 220px; display: flex; align-items: center; justify-content: center; background: #fff; border: 2px dashed #cbd5e1; border-radius: 14px; overflow: hidden; }
  #cv { width: 100%; display: none; touch-action: none; cursor: crosshair; }
  #guide { padding: 20px; text-align: center; font-size: .9rem; line-height: 1.5; color: var(--sub); }
  #guide b { display: block; margin-bottom: 6px; font-size: 1rem; color: var(--text); }
  #busy { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(255,255,255,.9); font-weight: 600; font-size: .88rem; }
  .spinner { width: 32px; height: 32px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: .78rem; color: var(--sub); text-align: center; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .btn { padding: 14px; border: 0; border-radius: 12px; font-weight: 700; font-size: 1rem; font-family: inherit; color: #fff; background: var(--accent); cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.green { background: var(--green); } .btn.amber { background: var(--amber); } .btn.red { background: var(--red); }
  .btn.plain { background: #fff; color: var(--text); border: 1px solid var(--line); font-size: .9rem; }
  .btn.sm { padding: 8px 10px; font-size: .8rem; }
  .verdict { padding: 16px; border: 2px solid; border-radius: 14px; }
  .verdict h2 { font-size: 1.12rem; margin-bottom: 4px; }
  .verdict p { font-size: .88rem; margin-bottom: 8px; }
  .verdict ul { padding: 8px 12px 8px 26px; border-radius: 8px; background: rgba(255,255,255,.75); font-size: .82rem; }
  .v-green { color: var(--green); border-color: #22c55e; background: var(--green-bg); }
  .v-amber { color: var(--amber); border-color: #f59e0b; background: var(--amber-bg); }
  .v-red { color: var(--red); border-color: #ef4444; background: var(--red-bg); }
  .tag { margin-left: 4px; padding: 1px 6px; border-radius: 6px; background: #e0e7ff; color: #4338ca; font-size: .7rem; }
  .chip { padding: 2px 9px; border-radius: 99px; font-size: .75rem; font-weight: 700; }
  .chip.v-green { background: #dcfce7; } .chip.v-amber { background: #fef3c7; } .chip.v-red { background: #fee2e2; }
  .log { display: flex; gap: 12px; }
  .log img { width: 76px; height: 76px; flex-shrink: 0; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .log .meta { font-size: .78rem; color: var(--sub); }
  .log .name { margin: 3px 0; font-weight: 700; }
  .empty { padding: 30px 0; text-align: center; color: var(--sub); }
  /* 결과 카드 */
  .pick { padding: 20px; }
  .pick-head { display: flex; justify-content: space-between; align-items: center; font-size: .78rem; }
  .eyebrow { color: #0e7490; font-weight: 700; }
  .muted { color: var(--sub); }
  .pick-top { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
  .pick-top h3 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; word-break: keep-all; }
  .pick-top .sub { margin-top: 4px; font-size: .85rem; color: var(--sub); }
  .figs { display: flex; gap: 4px; flex-shrink: 0; }
  .pick-top figure { text-align: center; }
  .pick-top figure svg { border-radius: 8px; border: 1px solid var(--line); display: block; }
  .pick-top figure img { display: block; width: 78px; height: 58px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #eee; }
  .pick-top figcaption { font-size: .68rem; color: var(--sub); margin-top: 2px; }
  .tag.rx { background: #dcfce7; color: var(--green); }
  .tag.no { background: #fee2e2; color: var(--red); }
  .pick .tags { margin-top: 8px; }
  .pick .tags .tag { display: inline-block; margin: 0; padding: 3px 8px; font-size: .74rem; font-weight: 700; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); font-size: .84rem; word-break: break-all; }
  .facts small { display: block; font-size: .7rem; color: var(--sub); margin-bottom: 3px; }
  .total { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .total b { font-size: 1rem; }
  .total small { display: block; font-size: .72rem; color: var(--sub); margin-top: 3px; }
  .big { font-size: 2.6rem; font-weight: 300; color: #0e7490; letter-spacing: .02em; }
  .big span { font-size: 1.1rem; margin-left: 2px; }
  .ev-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 2px; }
  .ev-head b { font-size: 1.05rem; }
  .ev-head small, .ev-sub { font-size: .72rem; color: var(--sub); }
  .ev { margin-top: 10px; padding: 10px 12px; border-radius: 8px; }
  .ev.first { border: 1px solid #0e7490; background: #ecfeff; }
  .ev-row { display: flex; justify-content: space-between; align-items: center; }
  .ev-row b { font-size: .95rem; }
  .ev .num { display: inline-block; min-width: 24px; padding: 1px 5px; margin-right: 8px; border-radius: 4px; background: #f1f5f9; color: var(--sub); font-size: .72rem; text-align: center; font-family: ui-monospace, monospace; }
  .ev.first .num { background: #0e7490; color: #fff; }
  .ev .pc { font-size: .95rem; font-weight: 600; }
  .ev .pc.bad { color: var(--red); }
  .ev .detail { font-size: .76rem; color: var(--sub); margin: 3px 0 6px; }
  .bar { height: 3px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #475569; }
  .ev.first .bar i { background: #0e7490; }
  .ev .bar i.bad { background: var(--red); }
  .others-head { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 6px; }
  .others-head b { font-size: .95rem; }
  .count { margin-left: 6px; padding: 1px 8px; border-radius: 4px; background: #f1f5f9; font-size: .74rem; color: var(--sub); }
  .other { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-family: inherit; cursor: pointer; }
  .other:hover { background: #f8fafc; }
  .other .nm { flex: 1; font-size: .88rem; font-weight: 600; }
  .other .nm small { display: block; font-weight: 400; font-size: .72rem; color: var(--sub); margin-top: 2px; }
  .other .sc { font-size: .9rem; color: var(--sub); white-space: nowrap; }
  .other .chev { color: #94a3b8; }
  .thumb svg { display: block; border-radius: 6px; border: 1px solid var(--line); }
  .back { border: 0; background: none; color: #0e7490; font-size: .78rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw; padding: 12px 18px; border-radius: 12px; background: #1e293b; color: #fff; font-size: .9rem; box-shadow: 0 6px 20px #0003; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 class="brand"><img src="/logo.png" alt=""><span>pills</span></h1>
  <span id="health">연결 중</span>
</header>
<nav>
  <button class="on" data-tab="check">투약 확인</button>
  <button data-tab="logs">확인 기록</button>
  <button data-tab="queue">약사 확인 목록<span id="qCount" class="hidden"></span></button>
</nav>

<main id="tab-check">
  <section class="card">
    <div class="head">
      <div class="title">환자와 오늘 처방</div>
      <div><button class="link" id="addPatientBtn">+ 환자</button> <button class="link" id="editBtn">수정</button></div>
    </div>
    <select id="patientSel"></select>
    <div id="rxList"></div>
    <div id="newPatientBox" class="edit hidden">
      <div class="line"><input id="newNameIn" placeholder="새 환자 이름 (예: 이영희 님 (308호))"><button class="ok-btn" id="newPatientOk">추가</button><button class="ok-btn" id="newPatientCancel">취소</button></div>
    </div>
    <div id="editBox" class="edit hidden">
      <div class="line"><input id="nameIn" placeholder="환자 이름"><button class="ok-btn" id="saveNameBtn">이름 저장</button><button class="x-btn" id="delPatientBtn">환자 삭제</button></div>
      <div id="rxEdit"></div>
      <input id="drugQ" placeholder="처방 추가: 약 이름, 각인, 품목코드로 검색 (예: 타이레놀, VL, K-029315)">
      <div id="hits" class="hits hidden"></div>
    </div>
  </section>

  <section class="demo">
    <div class="title">무대 사례 (테스트 사진)</div>
    <div class="row" id="demoBtns"></div>
  </section>

  <section id="viewer">
    <div id="guide"><b id="guideTitle">알약 한 알을 촬영하세요</b>한 장에 한 알, 단색 바탕 위에 놓고 찍어 주세요.</div>
    <canvas id="cv"></canvas>
    <div id="busy"><div class="spinner"></div><div id="busyText"></div></div>
  </section>
  <p class="hint hidden" id="boxHint"></p>

  <div class="row">
    <input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="albumIn" accept="image/*" hidden>
    <button class="btn plain" id="shootBtn">촬영</button>
    <button class="btn plain" id="albumBtn">앨범</button>
    <button class="btn" id="checkBtn" disabled style="flex:1.4">확인하기</button>
  </div>

  <div id="result" class="hidden" style="display:flex; flex-direction:column; gap:12px"></div>
</main>

<main id="tab-logs" class="hidden">
  <section class="card">
    <div class="title">확인 기록</div>
    <select id="logPatientSel"></select>
  </section>
  <div id="logList" style="display:flex; flex-direction:column; gap:10px"></div>
</main>

<main id="tab-queue" class="hidden">
  <section class="card"><div class="title">판단 보류와 불일치 의심 중 아직 처리하지 않은 건</div></section>
  <div id="queueList" style="display:flex; flex-direction:column; gap:10px"></div>
</main>

<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

const VERDICT = {
  '일치 후보': { cls: 'v-green', color: '#22c55e', desc: '처방약과 일치하는 후보입니다. 담당자가 확인한 뒤 투약하세요.' },
  '불일치 의심': { cls: 'v-red', color: '#ef4444', desc: '처방에 없는 약으로 보입니다. 투약을 멈추고 간호사·약사에게 확인하세요.' },
  '판단 보류': { cls: 'v-amber', color: '#f59e0b', desc: 'AI가 판단하지 않았습니다. 약사 확인 목록으로 보냈습니다.' },
};

let patients = [];
let patient = null;
let target = null;        // 선택한 처방약 순번
const given = {};         // 환자별 투약 완료한 품목
let img, imageId, imgW, imgH, bbox, scale;
const cv = $('cv');
const ctx = cv.getContext('2d');

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}

function post(path, data) {
  return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
}

// 알림은 화면 아래 메시지로 (일부 앱 내 브라우저는 alert·prompt·confirm 창을 막는다)
let toastTimer;
function toast(text, isError) {
  const t = $('toast');
  t.textContent = text;
  t.classList.toggle('err', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function put(path, data) {
  return api(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
}

async function checkHealth() {
  try {
    const h = await api('/api/health');
    $('health').textContent = h.ready ? 'AI 준비됨' : h.error ? '모델 오류' : '모델 로딩 중';
    $('health').classList.toggle('ready', h.ready);
    if (!h.ready && !h.error) setTimeout(checkHealth, 3000);
  } catch {
    $('health').textContent = '서버 연결 안 됨';
    setTimeout(checkHealth, 5000);
  }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

function showTab(name) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  for (const t of ['check', 'logs', 'queue']) $('tab-' + t).classList.toggle('hidden', t !== name);
  if (name === 'logs') loadLogs();
  if (name === 'queue') loadQueue();
}

async function loadPatients(keepId) {
  patients = await api('/api/patients');
  const options = patients.map(p => `<option value="${p.id}">${esc(p.name)} · ${p.rx.length}알</option>`).join('');
  $('patientSel').innerHTML = options || '<option value="">환자 없음</option>';
  $('logPatientSel').innerHTML = '<option value="">전체 환자</option>' + options;
  const id = patients.some(p => p.id === keepId) ? keepId : patients[0]?.id;
  if (id) $('patientSel').value = id;
  selectPatient(id, id === keepId);
}

async function init() {
  checkHealth();
  $('patientSel').onchange = () => selectPatient($('patientSel').value);
  $('logPatientSel').onchange = loadLogs;
  await loadPatients();

  const cases = await api('/api/demo_cases');
  $('demoBtns').innerHTML = cases.map((c, i) => `<button data-i="${i}">${esc(c.case)} (${c.patient})</button>`).join('');
  $('demoBtns').querySelectorAll('button').forEach(b => b.onclick = async () => {
    const c = cases[b.dataset.i];
    if (c.patient !== patient.id) {
      $('patientSel').value = c.patient;
      selectPatient(c.patient);
    }
    const blob = await (await fetch(c.image_url)).blob();
    openPhoto(new File([blob], 'demo.png', { type: blob.type }));
  });
  updateQueueCount();
}

function selectPatient(id, keepPhoto) {
  patient = patients.find(p => p.id === id) || { id: '', name: '', rx: [] };
  given[patient.id] ??= {};
  target = null;
  if (!keepPhoto) resetPhoto();
  renderRx();
  renderEdit();
  if (patient.id) syncGiven(patient.id);
}

// 오늘 '투약 완료'로 기록된 약은 새로고침해도 완료로 보이게
async function syncGiven(id) {
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const logs = await api('/api/logs?patient_id=' + id);
  for (const l of logs) {
    if (l.status === '투약 완료' && l.created_at.startsWith(today) && l.top1_item) given[id][l.top1_item] = true;
  }
  if (patient.id === id) renderRx();
}

// 환자·처방 수정
$('editBtn').onclick = () => {
  $('editBox').classList.toggle('hidden');
  $('editBtn').textContent = $('editBox').classList.contains('hidden') ? '수정' : '닫기';
  renderEdit();
};
$('addPatientBtn').onclick = () => {
  $('newPatientBox').classList.toggle('hidden');
  $('newNameIn').focus();
};
$('newPatientCancel').onclick = () => $('newPatientBox').classList.add('hidden');
$('newNameIn').onkeydown = e => { if (e.key === 'Enter') $('newPatientOk').click(); };
$('newPatientOk').onclick = async () => {
  const name = $('newNameIn').value.trim();
  if (!name) return toast('이름을 입력하세요', true);
  const { id } = await post('/api/patients', { name });
  $('newNameIn').value = '';
  $('newPatientBox').classList.add('hidden');
  await loadPatients(id);
  $('editBox').classList.remove('hidden');
  $('editBtn').textContent = '닫기';
  renderEdit();
  toast(`[${name}] 환자를 추가했습니다. 아래에서 처방을 검색해 넣으세요.`);
};
$('saveNameBtn').onclick = async () => {
  await put(`/api/patients/${patient.id}`, { name: $('nameIn').value });
  await loadPatients(patient.id);
  toast('이름을 저장했습니다');
};
// 삭제는 두 번 눌러야 한다 (확인 창 대신)
let deleteArmed = null;
$('delPatientBtn').onclick = async () => {
  const b = $('delPatientBtn');

    b.textContent = '한 번 더 누르면 삭제';

async function openPhoto(file) {
  $('result').classList.add('hidden');
  $('checkBtn').disabled = true;
  setBusy('사진 올리는 중');
  try {
    const form = new FormData();
    form.append('image', file);
    const up = await api('/api/upload', { method: 'POST', body: form });
    ({ image_id: imageId, width: imgW, height: imgH, bbox } = up);
    img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = `/api/images/${imageId}`;
    });
    scale = Math.min(1, 1024 / Math.max(imgW, imgH));
    cv.width = Math.round(imgW * scale);
    cv.height = Math.round(imgH * scale);
    $('guide').style.display = 'none';
    cv.style.display = 'block';
    $('boxHint').classList.remove('hidden');
    $('boxHint').textContent = bbox
      ? '초록 상자가 찾은 알약 위치입니다. 틀리면 사진 위를 드래그해 알약을 감싸 주세요. 넉넉하게 그려도 알약에 맞게 줄여 줍니다.'
      : '알약 위치를 찾지 못했습니다. 사진 위를 드래그해 알약을 감싸 주세요.';
    draw();
    $('checkBtn').disabled = false;
  } catch (e) {
    toast('사진을 올리지 못했습니다: ' + e.message, true);
  }
  setBusy(null);
}

function resetPhoto() {
  img = imageId = bbox = null;
  cv.style.display = 'none';
  $('guide').style.display = '';
  $('guideTitle').textContent = '알약 한 알을 촬영하세요';
  $('boxHint').classList.add('hidden');
  $('checkBtn').disabled = true;
  $('result').classList.add('hidden');
}

function setBusy(text) {
  $('busy').style.display = text ? 'flex' : 'none';
  $('busyText').textContent = text || '';
}

function draw(color = '#22c55e', label) {
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  if (!bbox) return;
  const [x, y, w, h] = bbox.map(v => v * scale);
  ctx.lineWidth = Math.max(3, cv.width * 0.006);
  ctx.strokeStyle = color;
  ctx.strokeRect(x, y, w, h);
  if (label) {
    ctx.font = `bold ${Math.max(14, cv.width * 0.024)}px sans-serif`;
    const top = Math.max(0, y - 30);
    ctx.fillStyle = color;
    ctx.fillRect(x, top, ctx.measureText(label).width + 14, 30);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + 7, top + 21);
  }
}

// 사진 위를 드래그해서 상자를 다시 그림
let dragFrom = null;
function imagePoint(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * imgW, (e.clientY - r.top) / r.height * imgH];
}
cv.onpointerdown = e => {
  dragFrom = imagePoint(e);
  cv.setPointerCapture(e.pointerId);
};
cv.onpointermove = e => {
  if (!dragFrom) return;
  const [x1, y1] = dragFrom;
  const [x2, y2] = imagePoint(e);
  bbox = [Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)].map(Math.round);
  draw('#6366f1');
};
cv.onpointerup = () => {
  dragFrom = null;
  if (!bbox) return;
  let [x, y, w, h] = bbox;
  x = Math.max(0, x);
  y = Math.max(0, y);
  bbox = Math.min(w, h) < 16 ? null : [x, y, Math.min(w, imgW - x), Math.min(h, imgH - y)];
  draw();
};

const pct = p => Math.round(p * 100) + '%';
const ATTRS = [['imprint', '각인'], ['color', '색상'], ['shape', '형상'], ['line', '분할선']];
const shownResults = new Map();

function splitName(name) {
  const m = name.match(/^([^(]*)\(([^)]*)\)(.*)$/);
  return m ? [m[1] + m[3], m[2]] : [name, ''];
}

function evidence(r, t) {
  const m = t.match, a = r.attrs;
  const dbImprint = [...m.imprint.catalog.front, ...m.imprint.catalog.back].join(' / ') || '없음';
  return {
    imprint: `검출 「${esc(a.imprint.text || '못 읽음')}」 · 기준 「${esc(dbImprint)}」`,
    color: `검출 ${esc(a.color[0].label)} (${pct(a.color[0].probability)}) · 기준 ${esc(m.color.catalog)}`,
    shape: `검출 ${esc(a.shape[0].label)} (${pct(a.shape[0].probability)}) · 기준 ${esc(m.shape.catalog)}`,
    line: `검출 ${esc(a.line.label)} (유무 ${pct(a.line.presence_probability)}) · 기준 ${esc(m.line.catalog)}`,
  };
}

const PILL_COLORS = { 하양: '#f7f7f4', 노랑: '#f3dc6b', 주황: '#f2a057', 분홍: '#f4b3c6', 빨강: '#dc5050', 갈색: '#9a6a42',
  연두: '#b6dd77', 초록: '#4fae6c', 청록: '#38b0a5', 파랑: '#4a7fd6', 남색: '#2d3f8e', 자주: '#9a3a8a', 보라: '#8d6ad0', 회색: '#a3a7ab', 검정: '#2b2b2b' };

// DB 정보(색·모양·각인)로 그린 알약 그림
function pillSVG(colorText, shape, imprint, w = 104, h = 78) {
  const cols = colorText.split('+').map(c => PILL_COLORS[c]).filter(Boolean);
  const [c1, c2] = [cols[0] || '#e5e7eb', cols[1] || cols[0] || '#e5e7eb'];
  const W = 120, H = 90, cx = 60, cy = 45;
  const outline = {
    원형: `<circle cx="${cx}" cy="${cy}" r="34"/>`,
    타원형: `<ellipse cx="${cx}" cy="${cy}" rx="48" ry="30"/>`,
    장방형: `<rect x="10" y="22" width="100" height="46" rx="23"/>`,
    반원형: `<path d="M22 60 A38 38 0 0 1 98 60 Z"/>`,
    삼각형: `<path d="M60 12 L100 74 L20 74 Z"/>`,
    사각형: `<rect x="24" y="12" width="72" height="66" rx="10"/>`,
    마름모형: `<path d="M60 8 L104 45 L60 82 L16 45 Z"/>`,
    오각형: `<path d="M60 10 L96 36 L82 78 L38 78 L24 36 Z"/>`,
    육각형: `<path d="M40 12 L80 12 L100 45 L80 78 L40 78 L20 45 Z"/>`,
    팔각형: `<path d="M44 10 L76 10 L98 32 L98 58 L76 80 L44 80 L22 58 L22 32 Z"/>`,
  }[shape] || `<rect x="14" y="18" width="92" height="54" rx="16"/>`;
  const id = 'p' + Math.random().toString(36).slice(2, 8);
  const text = (imprint || '').replace(/십자분할선|분할선/g, '|').replace(/마크/g, '').trim().slice(0, 10);
  const ink = ['#2b2b2b', '#2d3f8e', '#9a3a8a', '#4a7fd6', '#dc5050', '#9a6a42', '#4fae6c'].includes(c1) ? '#fff' : '#555';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${W} ${H}" role="img" aria-label="DB 외형">
    <defs><clipPath id="${id}">${outline}</clipPath></defs>
    <rect width="${W}" height="${H}" fill="#eef0f2"/>
    <g clip-path="url(#${id})"><rect width="${cx}" height="${H}" fill="${c1}"/><rect x="${cx}" width="${cx}" height="${H}" fill="${c2}"/></g>
    <g fill="none" stroke="#0002" stroke-width="1.5">${outline}</g>
    ${text ? `<text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="${text.length > 6 ? 10 : 13}" font-family="ui-monospace,monospace" fill="${ink}" opacity=".75">${esc(text)}</text>` : ''}
  </svg>`;
}

// 다른 후보 한 줄 설명: "각인 일치", "각인 일부 유사", "형상·색상 유사" 식
function similarity(t) {
  const m = t.match, parts = [];
  const s = m.imprint.score;
  if (s != null && s >= .95) parts.push('각인 일치');
  else if (s != null && s >= .5) parts.push('각인 일부 유사');
  const same = [['shape', '형상'], ['color', '색상'], ['line', '분할선']].filter(([k]) => m[k].ok).map(([, l]) => l);
  if (same.length === 3) parts.push('외형 일치');
  else if (same.length) parts.push(same.join('·') + ' 유사');
  if (s != null && s < .5) parts.push('각인 다름');
  return parts.join(' · ') || '닮은 점 적음';
}

function pickHTML(r, idx, imageId) {
  const t = r.top_k[idx], m = t.match;
  const [name, sub] = splitName(t.name);
  const ev = evidence(r, t);
  const rows = ATTRS.map(([k, label], n) => {
    const s = m[k].score;
    const bad = !m[k].ok;
    const shown = s === undefined ? '-' : s === null ? '로고면' : (s * 100).toFixed(0) + '%';
    return `
      <div class="ev ${n === 0 ? 'first' : ''}">
        <div class="ev-row"><span><span class="num">0${n + 1}</span><b>${label}</b></span><span class="pc ${bad ? 'bad' : ''}">${shown}</span></div>
        <div class="detail">${ev[k]}${bad ? ' · 불일치' : ''}</div>
        <div class="bar"><i class="${bad ? 'bad' : ''}" style="width:${s == null ? 50 : Math.round(s * 100)}%"></i></div>
      </div>`;
  }).join('');
  const others = r.top_k.map((o, j) => {
    if (j === idx) return '';
    return `
      <button class="other" data-cand="${j}">
        <span class="thumb">${pillSVG(o.match.color.catalog, o.match.shape.catalog, o.match.imprint.catalog.front[0] || o.match.imprint.catalog.back[0], 52, 39)}</span>
        <span class="nm">${esc(splitName(o.name)[0])}${o.in_rx ? ' <span class="tag rx">처방</span>' : ''}
          <small>후보 0${j + 1} · ${similarity(o)}</small>
        </span>
        <span class="sc">${(o.score * 100).toFixed(1)}%</span><span class="chev">›</span>
      </button>`;
  }).join('');
  const box = r.bbox;
  return `
    <div class="card pick">
      <div class="pick-head">
        <span class="eyebrow">${idx === 0 ? (r.verdict === '판단 보류' ? '가장 가까운 후보 (판단 보류)' : '가장 유력한 의약품') : '비교 중인 후보'}</span>
        <span class="muted">${idx === 0 ? '' : '<button class="back" data-cand="0">← 1순위로 </button> · '}후보 0${idx + 1}</span>
      </div>
      <div class="pick-top">
        <div>
          <h3>${esc(name)}</h3>
          ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
          <div class="tags">${t.in_rx ? '<span class="tag rx">오늘 처방에 있음</span>' : '<span class="tag no">오늘 처방에 없음</span>'}</div>
        </div>
        <div class="figs">
          ${imageId && box ? `<figure><img src="/api/images/${imageId}/crop?x=${box[0]}&y=${box[1]}&w=${box[2]}&h=${box[3]}" alt=""><figcaption>촬영 사진</figcaption></figure>` : ''}
          <figure>${pillSVG(m.color.catalog, m.shape.catalog, m.imprint.catalog.front[0] || m.imprint.catalog.back[0], 78, 58)}<figcaption>DB 외형</figcaption></figure>
        </div>
      </div>
      <div class="facts">
        <div><small>품목코드</small>${t.item}</div>
        <div><small>외형 (DB)</small>${esc(m.color.catalog)} · ${esc(m.shape.catalog)}</div>
        <div><small>검색 순위</small>${t.rank}위</div>
      </div>
      <div class="total">
        <div><b>종합 일치도</b><small>4가지 시각 특징을 합친 검색 점수 (확률 아님)</small></div>
        <div class="big">${(t.score * 100).toFixed(1)}<span>%</span></div>
      </div>
      <div class="ev-head"><b>이 약으로 판단한 근거</b><small>특징별 일치도</small></div>
      <div class="ev-sub">AI가 사진에서 읽은 값(검출)과 DB 기준을 비교했습니다.</div>
      ${rows}
      ${others ? `<div class="others-head"><span><b>다른 후보</b><span class="count">${r.top_k.length - 1}개</span></span><small class="muted">선택하여 비교</small></div>${others}` : ''}
      ${r.search && !r.reasons[0]?.startsWith("각인 '") ? `<p class="hint" style="margin-top:12px">1·2위 점수 차 ${r.search.score_margin.toFixed(3)} (보류 기준 ${r.search.margin_threshold.toFixed(3)})</p>` : ''}
    </div>`;
}

function resultHTML(r, imageId) {
  const v = VERDICT[r.verdict];
  const first = r.top_k[0];
  const key = 'r' + shownResults.size;
  shownResults.set(key, { r, imageId });
  let html = `
    <div class="verdict ${v.cls}">
      <h2>${esc(r.verdict)}${first && r.verdict !== '판단 보류' ? ' · ' + esc(splitName(first.name)[0]) : ''}</h2>
      <p>${esc(r.reason)}. ${v.desc}</p>
      <ul>${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    </div>`;
  if (r.top_k.length && r.attrs) html += `<div data-result="${key}">${pickHTML(r, 0, imageId)}</div>`;
  return html;
}

// 다른 후보를 누르면 그 후보로 카드 내용을 바꾼다
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cand]');
  const holder = b && b.closest('[data-result]');
  if (!holder) return;
  const { r, imageId } = shownResults.get(holder.dataset.result);
  holder.innerHTML = pickHTML(r, Number(b.dataset.cand), imageId);
});

function showResult(r) {
  const v = VERDICT[r.verdict];
  draw(v.color, r.verdict === '판단 보류' ? '판단 보류' : splitName(r.top_k[0].name)[0]);

  let buttons;
  if (r.verdict === '일치 후보') buttons = '<button class="btn green" data-act="administered">담당자 확인 후 투약</button>';
  else if (r.verdict === '불일치 의심') buttons = '<button class="btn red" data-act="stopped">투약 중지 · 약사 확인</button>';
  else buttons = '<button class="btn amber" data-act="queue">약사 확인 목록 보기</button>';

  const box = $('result');
  box.innerHTML = resultHTML(r, r.image_id) + `<div class="row">${buttons}<button class="btn plain" data-act="again">다시 촬영</button></div>`;
  box.classList.remove('hidden');
  box.scrollIntoView({ behavior: 'smooth' });

  box.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    if (act === 'again') return $('fileIn').click();
    if (act === 'queue') return showTab('queue');
    await post(`/api/logs/${r.log_id}/action`, { action: act, actor: '간호사' });
    if (act === 'stopped') {
      toast('투약을 중지하고 약사 확인 목록에 올렸습니다.');
      return;
    }
    given[patient.id][r.top_k[0].item] = true;
    target = null;
    renderRx();
    resetPhoto();
    const left = patient.rx.filter(x => !given[patient.id][x.item]).length;
    toast(left ? `투약 기록을 저장했습니다. 남은 처방 ${left}알` : '오늘 처방을 모두 확인했습니다.');
  });
}

function logCard(log, forPharmacist) {
  const v = VERDICT[log.verdict];
  const first = log.result.top_k[0];
  const ACT = { administered: '투약 완료', stopped: '투약 중지', resolved_match: '처방약 맞음', resolved_mismatch: '처방약 아님(회수)', retake: '재촬영 요청' };
  const history = log.actions.map(a => esc(`${a.at.slice(11, 16)} ${a.actor} ${ACT[a.action] || a.action}${a.note ? ' - ' + a.note : ''}`)).join('<br>');
  let html = `
    <div class="card">
      <div class="log">
        <img src="/api/images/${log.image_id}" alt="">
        <div>
          <div class="meta">${esc(log.created_at.slice(0, 16).replace('T', ' '))} · ${esc(log.patient_name)} · #${log.id}</div>
          <div class="name"><span class="chip ${v.cls}">${esc(log.verdict)}</span> ${esc(first ? first.name : '-')}</div>
          <div class="meta">${esc(log.reason)} · 상태: <b>${esc(log.status)}</b></div>
          ${history ? `<div class="meta">${history}</div>` : ''}
        </div>
      </div>`;
  if (forPharmacist) {
    html += `
      <details style="margin-top:10px">
        <summary class="meta" style="cursor:pointer">AI 근거 보기</summary>
        <div style="margin-top:8px; display:flex; flex-direction:column; gap:8px">${resultHTML(log.result, log.image_id)}</div>
      </details>
      <div class="edit" style="border:0; padding-top:0"><input class="note-in" placeholder="약사 메모 (선택)"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn green sm" data-id="${log.id}" data-act="resolved_match">처방약 맞음</button>
        <button class="btn red sm" data-id="${log.id}" data-act="resolved_mismatch">처방약 아님(회수)</button>
        <button class="btn plain sm" data-id="${log.id}" data-act="retake">재촬영 요청</button>
      </div>`;
  }
  return html + '</div>';
}

async function loadLogs() {
  const id = $('logPatientSel').value;
  const logs = await api('/api/logs' + (id ? '?patient_id=' + id : ''));
  $('logList').innerHTML = logs.map(l => logCard(l, false)).join('') || '<p class="empty">기록이 없습니다.</p>';
}

async function loadQueue() {
  const queue = await api('/api/review_queue');
  $('queueList').innerHTML = queue.map(l => logCard(l, true)).join('') || '<p class="empty">확인할 건이 없습니다.</p>';
  $('queueList').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const note = b.closest('.card').querySelector('.note-in')?.value.trim() || '';
    await post(`/api/logs/${b.dataset.id}/action`, { action: b.dataset.act, actor: '약사', note });
    toast('처리했습니다. 확인 기록에 남았습니다.');
    loadQueue();
  });
  setQueueCount(queue.length);
}

async function updateQueueCount() {
  setQueueCount((await api('/api/review_queue')).length);
}

function setQueueCount(n) {
  $('qCount').textContent = n;
  $('qCount').classList.toggle('hidden', n === 0);
}

init();
</script>
</body>
</html>
